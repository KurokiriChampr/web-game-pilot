<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="止まった世界の時間を取り戻す、選択肢分岐型テキストアドベンチャー。">
  <title>刻（とき）の女神と止まった世界</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="theme-title">
  <div class="sky" aria-hidden="true"></div>

  <!-- タイトル画面 -->
  <main id="title-screen" class="screen title-screen">
    <div class="title-card">
      <div class="title-clock" aria-hidden="true">⏳</div>
      <p class="title-sub">異世界転生テキストアドベンチャー</p>
      <h1 class="title-main">刻の女神と<br>止まった世界</h1>
      <p class="title-lead">
        目覚めた異世界は、すべての時間が止まっていた。<br>
        時の女神の少女とともに、三つの欠片を取り戻せ。
      </p>
      <div class="title-actions">
        <button id="start-btn" class="btn btn-primary" type="button">▶ はじめから</button>
        <button id="continue-btn" class="btn" type="button" hidden>⏯ つづきから</button>
      </div>
      <section class="endings" aria-labelledby="endings-heading">
        <h2 id="endings-heading" class="endings-heading">見つけたエンディング <span id="ending-count">0 / 3</span></h2>
        <ul id="ending-list" class="ending-list"></ul>
      </section>
      <p class="title-help">選択肢はタップ、またはキーボードの数字キーで選べます。</p>
    </div>
  </main>

  <!-- ゲーム画面 -->
  <div id="game-screen" class="screen game-screen" hidden>
    <header class="status-bar">
      <div class="status-item" title="時の欠片">
        <span class="status-label">欠片</span>
        <span id="status-shards" class="status-shards" role="img" aria-label="時の欠片">◇◇◇</span>
      </div>
      <div class="status-item status-heart" title="女神の心">
        <span class="status-label" aria-hidden="true">💗</span>
        <div id="heart-meter" class="heart-meter" role="meter" aria-label="女神の心" aria-valuemin="0" aria-valuemax="13" aria-valuenow="0">
          <div id="heart-fill" class="heart-fill"></div>
        </div>
      </div>
      <div class="status-actions">
        <button id="title-btn" class="btn btn-small" type="button" aria-label="タイトルへ戻る">🏠</button>
        <button id="restart-btn" class="btn btn-small" type="button">↺ 最初から</button>
      </div>
    </header>

    <main class="scene-card">
      <div class="scene-head">
        <span id="scene-icon" class="scene-icon" aria-hidden="true">🌸</span>
        <div>
          <p id="scene-step" class="scene-step">第1幕</p>
          <h2 id="scene-title" class="scene-title" tabindex="-1">シーン名</h2>
        </div>
      </div>

      <div id="scene-text" class="scene-text" aria-live="polite"></div>

      <div id="choices" class="choices"></div>

      <section id="ending-box" class="ending-box" hidden>
        <p class="ending-label">― ENDING ―</p>
        <p id="ending-name" class="ending-name"></p>
        <p id="ending-progress" class="ending-progress"></p>
        <div class="ending-actions">
          <button id="ending-restart" class="btn btn-primary" type="button">↺ もう一度はじめから</button>
          <button id="ending-title" class="btn" type="button">🏠 タイトルへ</button>
        </div>
      </section>
    </main>
  </div>

  <script src="js/story.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
